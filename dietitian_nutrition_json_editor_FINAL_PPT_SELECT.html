itable=\"true\">Evening Snack</span>\n                                </td>\n                                <td contenteditable=\"true\" class=\"py-2 px-4\">&nbsp;Chana chat salad with 3 dates<br></td>\n                                <td contenteditable=\"true\" class=\"py-2 px-4\">1/2 cup chickpeas+1/2 veges (onion tomato cucumber) +corn+ chat masala+ lemon juice&nbsp;</td>\n                                <td class=\"py-2 px-4 text-right font-medium\"><span contenteditable=\"true\" class=\"meal-cal\" oninput=\"calculateTotalCalories()\">110</span> kcal</td>\n                            </tr>\n                            <tr class=\"hover:bg-slate-50/80\">\n                                <td class=\"py-2 px-4 font-semibold text-brand-green flex items-center space-x-2\">\n                                    <span class=\"w-6 h-6 rounded-full bg-pink-50 text-pink-600 flex items-center justify-center text-xs\"><i class=\"fa-solid fa-utensils\"></i></span>\n                                    <span contenteditable=\"true\">Dinner</span>\n                                </td>\n                                <td contenteditable=\"true\" class=\"py-2 px-4\">Grilled fish with rice&nbsp;</td>\n                                <td contenteditable=\"true\" class=\"py-2 px-4\">100g grilled fish + 160-200g chicken&nbsp;</td>\n                                <td class=\"py-2 px-4 text-right font-medium\"><span contenteditable=\"true\" class=\"meal-cal\" oninput=\"calculateTotalCalories()\">350</span> kcal</td>\n                            </tr>\n                            <tr class=\"hover:bg-slate-50/80\">\n                                <td class=\"py-2 px-4 font-semibold text-brand-green flex items-center space-x-2\">\n                                    <span class=\"w-6 h-6 rounded-full bg-indigo-50 text-indigo-600 flex items-center justify-center text-xs\"><i class=\"fa-solid fa-moon\"></i></span>\n                                    <span contenteditable=\"true\">Bedtime</span>\n                                </td>\n                                <td contenteditable=\"true\" class=\"py-2 px-4\">Warm Chamomile Tea</td>\n                                <td contenteditable=\"true\" class=\"py-2 px-4\">1 cup unsweetened herbal tea</td>\n                                <td class=\"py-2 px-4 text-right font-medium\"><span contenteditable=\"true\" class=\"meal-cal\" oninput=\"calculateTotalCalories()\">15</span> kcal</td>\n                            </tr>\n                        </tbody>\n                    </table>\n                </div>\n\n                <!-- Total Calories Summary Box -->\n                <div class=\"flex justify-end z-10 relative\">\n                    <div class=\"bg-emerald-100/70 border border-emerald-200/80 px-6 py-2.5 rounded-2xl flex items-center space-x-3 text-sm shadow-sm\">\n                        <i class=\"fa-solid fa-calculator text-emerald-700 text-lg\"></i>\n                        <span class=\"font-bold text-emerald-900 tracking-wider\">TOTAL CALORIES:</span>\n                        <span contenteditable=\"true\" id=\"total-calories-val\" class=\"font-bold text-emerald-800 text-base border-b border-dashed border-emerald-500 min-w-[50px] text-center\">1385</span>\n                        <span class=\"font-semibold text-emerald-800\">kcal</span>\n                    </div>\n                </div>\n\n                <!-- Footer -->\n                <div class=\"border-t border-slate-200/80 pt-3 flex items-center justify-between text-xs text-slate-500 z-10 relative\">\n                    <div class=\"flex items-center space-x-2\">\n                        <div class=\"w-6 h-6 rounded-full bg-pink-100 text-brand-pink flex items-center justify-center text-xs\">\n                            <i class=\"fa-solid fa-heart-pulse\"></i>\n                        </div>\n                        <div>\n                            <span contenteditable=\"true\" class=\"brand-tagline font-semibold text >\n                        <h3 contenteditable=\"true\" class=\"font-bold text-slate-800 text-sm\">Wash &amp; Prep</h3>\n                        <p contenteditable=\"true\" class=\"text-xs text-slate-500 leading-relaxed\">Wash, dry and portion vegetables, fruits and salad ingredients in advance.</p>\n                    </div>\n\n                    <div class=\"bg-white p-5 rounded-2xl shadow-sm border border-slate-100 border-b-4 border-b-pink-400 flex flex-col items-center text-center space-y-2\">\n                        <div class=\"w-12 h-12 rounded-full bg-pink-100/70 text-pink-600 flex items-center justify-center text-xl mb-1\">\n                            <i class=\"fa-solid fa-fire-burner\"></i>\n                        </div>\n                        <h3 contenteditable=\"true\" class=\"font-bold text-brand-pink text-sm\">Batch Cooking</h3>\n                        <p contenteditable=\"true\" class=\"text-xs text-slate-500 leading-relaxed\">Prepare protein and staple foods in batches for 2–3 days when suitable.</p>\n                    </div>\n\n                    <div class=\"bg-white p-5 rounded-2xl shadow-sm border border-slate-100 border-b-4 border-b-amber-400 flex flex-col items-center text-center space-y-2\">\n                        <div class=\"w-12 h-12 rounded-full bg-amber-100/70 text-amber-600 flex items-center justify-center text-xl mb-1\">\n                            <i class=\"fa-solid fa-kitchen-set\"></i>\n                        </div>\n                        <h3 contenteditable=\"true\" class=\"font-bold text-amber-600 text-sm\">Healthy Cooking</h3>\n                        <p contenteditable=\"true\" class=\"text-xs text-slate-500 leading-relaxed\">Prefer baking, grilling, steaming, roasting, boiling or air-frying over deep-frying.</p>\n                    </div>\n\n                    <div class=\"bg-white p-5 rounded-2xl shadow-sm border border-slate-100 border-b-4 border-b-blue-400 flex flex-col items-center text-center space-y-2\">\n                        <div class=\"w-12 h-12 rounded-full bg-blue-100/70 text-blue-600 flex items-center justify-center text-xl mb-1\">\n                            <i class=\"fa-solid fa-scale-balanced\"></i>\n                        </div>\n                        <h3 contenteditable=\"true\" class=\"font-bold text-blue-600 text-sm\">Portion Control</h3>\n                        <p contenteditable=\"true\" class=\"text-xs text-slate-500 leading-relaxed\">Pre-portion meals and snacks using cups, spoons or a kitchen scale.</p>\n                    </div>\n\n                    <div class=\"bg-white p-5 rounded-2xl shadow-sm border border-slate-100 border-b-4 border-b-teal-400 flex flex-col items-center text-center space-y-2\">\n                        <div class=\"w-12 h-12 rounded-full bg-teal-100/70 text-teal-600 flex items-center justify-center text-xl mb-1\">\n                            <i class=\"fa-solid fa-box-archive\"></i>\n                        </div>\n                        <h3 contenteditable=\"true\" class=\"font-bold text-teal-600 text-sm\">Safe Storage</h3>\n                        <p contenteditable=\"true\" class=\"text-xs text-slate-500 leading-relaxed\">Cool cooked foods properly and store them safely in clean, covered containers.</p>\n                    </div>\n\n                    <div class=\"bg-white p-5 rounded-2xl shadow-sm border border-slate-100 border-b-4 border-b-purple-400 flex flex-col items-center text-center space-y-2\">\n                        <div class=\"w-12 h-12 rounded-full bg-purple-100/70 text-purple-600 flex items-center justify-center text-xl mb-1\">\n                            <i class=\"fa-solid fa-clipboard-list\"></i>\n                        </div>\n                        <h3 contenteditable=\"true\" class=\"font-bold text-brand-purple text-sm\">Plan Ahead</h3>\n                        <p contenteditable=\"true\" class=\"text-xs text-slate-500 leading-relaxed\">Prepare a shopping list and choose meals for the next day before bedtime.</p>\n                    </div>\n                </div>\n\n                <!-- Footer -->\n                <div class=\"border-t border-slate-200/80 pt-3 flex items-center justify-between text-xs text-slate-500 z-10 relative\">\n                    <div class=\"flex items-center space-x-2\">\n                        <div class=\"w-6 h-6 rounded-full bg-pink-100 text-brand-pink flex items-center justify-center text-xs\">\n                            <i class=\"fa-solid fa-heart-pulse\"></i>\n                        </div>\n                        <div>\n                            <span contenteditable=\"true\" class=\"brand-tagline font-semibold text-slate-700 tracking-wider\">NOURISHING BODIES, ENRICHING LIVES</span>\n                        </div>\n                    </div>\n                    <div class=\"flex items-center space-x-6\">\n                        <span contenteditable=\"true\" class=\"brand-name-full font-medium\">Muneeba Munir</span>\n                        <span contenteditable=\"true\" class=\"brand-phone font-medium\">+92 315 5687486</span>\n                        <span contenteditable=\"true\" class=\"brand-insta font-medium\">muneeba_munir07</span>\n                    </div>\n                </div>\n            "}, {"slideNumber": 4, "htmlContent": "\n<svg class=\"bg-leaf-1\" fill=\"none\" viewbox=\"0 0 200 200\"><path d=\"M100 0C150 50 180 120 180 200C100 200 20 150 0 100C30 30 70 0 100 0Z\" fill=\"#3d7042\"></path></svg>\n<div class=\"flex items-center space-x-3 z-10 relative\">\n<div class=\"w-12 h-12 rounded-2xl bg-gradient-to-br from-pink-400 to-rose-500 text-white flex items-center justify-center text-2xl shadow\">\n<i class=\"fa-solid fa-utensils\"></i>\n</div>\n<div>\n<h2 class=\"font-heading font-extrabold text-2xl text-brand-green tracking-tight\" contenteditable=\"true\">Recipe <span class=\"text-brand-pink\">CARD #1</span></h2>\n</div>\n</div>\n<div class=\"bg-white rounded-2xl shadow-sm border border-slate-100 grid grid-cols-2 text-xs z-10 relative recipe-info-box p-2.5 my-1.5 gap-2\">\n<div class=\"border-r border-slate-100 space-y-1\">\n<div class=\"flex items-center justify-between\">\n<span class=\"text-slate-500 font-medium\"><i class=\"fa-solid fa-book-open text-pink-500 mr-1.5\"></i> Recipe Name:</span>\n<span class=\"font-bold text-slate-800 border-b border-dashed border-slate-300\" contenteditable=\"true\">Masala Oats with Egg </span>\n</div>\n<div class=\"flex items-center justify-between\">\n<span class=\"text-slate-500 font-medium\"><i class=\"fa-solid fa-users text-emerald-500 mr-1.5\"></i> Servings:</span>\n<span class=\"font-semibold text-slate-800 border-b border-dashed border-slate-300\" contenteditable=\"true\">1 Servings</span>\n</div>\n<div class=\"flex items-center justify-between\">\n<span class=\"text-slate-500 font-medium\"><i class=\"fa-regular fa-clock text-amber-500 mr-1.5\"></i> Prep Time:</span>\n<span class=\"font-semibold text-slate-800 border-b border-dashed border-slate-300\" contenteditable=\"true\">5 mins</span>\n</div>\n<div class=\"flex items-center justify-between\">\n<span class=\"text-slate-500 font-medium\"><i class=\"fa-solid fa-fire-burner text-purple-500 mr-1.5\"></i> Cooking Time:</span>\n<span class=\"font-semibold text-slate-800 border-b border-dashed border-slate-300\" contenteditable=\"true\">12-15 mins</span>\n</div>\n</div>\n<div class=\"space-y-1\">\n<div class=\"flex items-center justify-between\">\n<span class=\"text-slate-500 font-medium\"><i class=\"fa-solid fa-bolt text-amber-500 mr-1.5\"></i> Calories/Serving:</span>\n<span class=\"font-bold text-slate-800\"><span contenteditable=\"true\">280</span> kcal</span>\n</div>\n<div class=\"flex items-center justify-between\">\n<span class=\"text-slate-500 font-medium\"><i class=\"fa-solid fa-drumstick-bite text-pink-500 mr-1.5\"></i> Protein:</span>\n<span class=\"font-semibold text-slate-800\"><span contenteditable=\"true\">14</span> g</span>\n</div>\n<div class=\"flex items-center justify-between\">\n<span class=\"text-slate-500 font-medium\"><i class=\"fa-solid fa-wheat-awn text-emerald-500 mr-1.5\"></i> Carbohydrates:</span>\n<span class=\"font-semibold text-slate-800\"><span contenteditable=\"true\">30</span> g</span>\n</div>\n<div class=\"flex items-center justify-between\">\n<span class=\"text-slate-500 font-medium\"><i class=\"fa-solid fa-droplet text-amber-500 mr-1.5\"></i> Fat:</span>\n<span class=\"font-semibold text-slate-800\"><span contenteditable=\"true\">9</span> g</span>\n</div>\n</div>\n</div>\n<div class=\"grid grid-cols-12 gap-4 my-auto z-10 relative\">\n<div class=\"col-span-5 bg-white p-3.5 rounded-2xl shadow-sm border border-slate-100 flex flex-col\">\n<div class=\"bg-brand-lightgreen text-brand-green px-3 py-1.5 rounded-xl font-bold text-xs flex items-center gap-2 mb-2\">\n<i class=\"fa-solid fa-leaf\"></i> INGREDIENTS\n                        </div>\n<ul class=\"text-xs text-slate-700 space-y-1.5 pl-2 list-disc list-inside leading-snug\" contenteditable=\"true\">\n<li><span style=\"font-size: 0.75rem;\">2 tbsp oats</span></li><li>1 egg</li><li>½ cup mixed vegetables</li><li>½ cup water</li><li>1 tsp oil</li><li>¼ tsp cumin</li><li>¼ tsp black pepper</li><li>Pinch of salt</li><li>Coriander</li>\n</ul>\n</div>\n<div class=\"col-span-7 bg-white p-3.5 rounded-2xl shadow-sm border border-slate-100 flex flex-col\">\n<div class=\"bg-brand-lightpink text-brand-pink px-3 py-1.5 rounded-xl font-bold text-xs flex items-center gap-2 mb-2\">\n<i class=\"fa-solid fa-list-ol\"></i> METHOD\n                        </div>\n<ol class=\"text-xs text-slate-700 space-y-1.5 pl-2 list-decimal list-inside leading-snug\" contenteditable=\"true\">\n<li>Heat oil in a pan and add cumin.</li><li>Add chopped vegetables and sauté for 2–3 minutes.</li><li>Add oats and water.</li><li>Cook until oats become soft.</li><li>Season with black pepper, salt and coriander.</li><li>Boil the egg and serve on it.</li>\n</ol>\n</div>\n</div>\n<div class=\"grid grid-cols-3 gap-3 z-10 relative\">\n<div class=\"bg-brand-lightpurple p-3 rounded-2xl border border-purple-100 text-xs\">\n<span class=\"font-bold text-brand-purple block mb-1\"><i class=\"fa-solid fa-weight-hanging mr-1\"></i> PORTION SIZE</span>\n<div class=\"text-slate-700\" contenteditable=\"true\">1 serving = 1 bowl </div>\n</div>\n<div class=\"bg-brand-lightblue p-3 rounded-2xl border border-blue-100 text-xs\">\n<span class=\"font-bold text-brand-blue block mb-1\"><i class=\"fa-solid fa-box-archive mr-1\"></i> MEAL PREP &amp; STORAGE</span>\n<div class=\"text-slate-700\" contenteditable=\"true\">Best eaten fresh. Vegetables can be chopped beforehand.</div>\n</div>\n<div class=\"bg-brand-lightyellow p-3 rounded-2xl border border-amber-100 text-xs\">\n<span class=\"font-bold text-brand-yellow block mb-1\"><i class=\"fa-solid fa-lightbulb mr-1\"></i> NUTRITION TIP</span>\n<div class=\"text-slate-700 italic\" contenteditable=\"true\">\"Adding egg makes the oats more filling and increases protein.</div>\n</div>\n</div>\n\n"}, {"slideNumber": 5, "htmlContent": "\n<svg class=\"bg-leaf-1\" fill=\"none\" viewbox=\"0 0 200 200\"><path d=\"M100 0C150 50 180 120 180 200C100 200 20 150 0 100C30 30 70 0 100 0Z\" fill=\"#3d7042\"></path></svg>\n<div class=\"flex items-center space-x-3 z-10 relative\">\n<div class=\"w-12 h-12 rounded-2xl bg-gradient-to-br from-emerald-500 to-teal-600 text-white flex items-center justify-center text-2xl shadow\">\n<i class=\"fa-solid fa-seedling\"></i>\n</div>\n<div>\n<h2 class=\"font-heading font-extrabold text-2xl text-brand-green tracking-tight\" contenteditable=\"true\">Recipe <span class=\"text-brand-pink\">CARD #2</span></h2>\n</div>\n</div>\n<div class=\"bg-white rounded-2xl shadow-sm border border-slate-100 grid grid-cols-2 text-xs z-10 relative recipe-info-box p-2.5 my-1.5 gap-2\">\n<div class=\"border-r border-slate-100 space-y-1\">\n<div class=\"flex items-center justify-between\">\n<span class=\"text-slate-500 font-medium\"><i class=\"fa-solid fa-book-open text-pink-500 mr-1.5\"></i> Recipe Name:</span>\n<span class=\"font-bold text-slate-800 border-b border-dashed border-slate-300\" contenteditable=\"true\">Chicken Chapati Wrap</span>\n</div>\n<div class=\"flex items-center justify-between\">\n<span class=\"text-slate-500 font-medium\"><i class=\"fa-solid fa-users text-emerald-500 mr-1.5\"></i> Servings:</span>\n<span class=\"font-semibold text-slate-800 border-b border-dashed border-slate-300\" contenteditable=\"true\">1 Serving</span>\n</div>\n<div class=\"flex items-center justify-between\">\n<span class=\"text-slate-500 font-medium\"><i class=\"fa-regular fa-clock text-amber-500 mr-1.5\"></i> Prep Time:</span>\n<span class=\"font-semibold text-slate-800 border-b border-dashed border-slate-300\" contenteditable=\"true\">10 mins</span>\n</div>\n<div class=\"flex items-center justify-between\">\n<span class=\"text-slate-500 font-medium\"><i class=\"fa-solid fa-fire-burner text-purple-500 mr-1.5\"></i> Cooking Time:</span>\n<span class=\"font-semibold text-slate-800 border-b border-dashed border-slate-300\" contenteditable=\"true\">10-12 mins</span>\n</div>\n</div>\n<div class=\"space-y-1\">\n<div class=\"flex items-center justify-between\">\n<span class=\"text-slate-500 font-medium\"><i class=\"fa-solid fa-bolt text-amber-500 mr-1.5\"></i> Calories/Serving:</span>\n<span class=\"font-bold text-slate-800\"><span contenteditable=\"true\">300</span> kcal</span>\n</div>\n<div class=\"flex items-center justify-between\">\n<span class=\"text-slate-500 font-medium\"><i class=\"fa-solid fa-drumstick-bite text-pink-500 mr-1.5\"></i> Protein:</span>\n<span class=\"font-semibold text-slate-800\"><span contenteditable=\"true\">22</span> g</span>\n</div>\n<div class=\"flex items-center justify-between\">\n<span class=\"text-slate-500 font-medium\"><i class=\"fa-solid fa-wheat-awn text-emerald-500 mr-1.5\"></i> Carbohydrates:</span>\n<span class=\"font-semibold text-slate-800\"><span contenteditable=\"true\">30</span> g</span>\n</div>\n<div class=\"flex items-center justify-between\">\n<span class=\"text-slate-500 font-medium\"><i class=\"fa-solid fa-droplet text-amber-500 mr-1.5\"></i> Fat:</span>\n<span class=\"font-semibold text-slate-800\"><span contenteditable=\"true\">10</span> g</span>\n</div>\n</div>\n</div>\n<div class=\"grid grid-cols-12 gap-4 my-auto z-10 relative\">\n<div class=\"col-span-5 bg-white p-3.5 rounded-2xl shadow-sm border border-slate-100 flex flex-col\">\n<div class=\"bg-brand-lightgreen text-brand-green px-3 py-1.5 rounded-xl font-bold text-xs flex items-center gap-2 mb-2\">\n<i class=\"fa-solid fa-leaf\"></i> INGREDIENTS\n                        </div>\n<ul class=\"text-xs text-slate-700 space-y-1.5 pl-2 list-disc list-inside leading-snug\" contenteditable=\"true\">\n<li><span style=\"font-size: 0.75rem;\">60 g cooked chicken breast, shredded</span></li><li>2 small chapati</li><li>½ cup vege (cucumber,sliced &amp; tomato, chopped)</li><li>1 tbsp low-fat yogurt</li><li>1 tsp oil</li><li>1 tsp lemon juice</li><li>¼ tsp black pepper</li><li>Pinch of salt</li><li>Coriander/mint</li>\n</ul>\n</div>\n<div class=\"col-span-7 bg-white p-3.5 rounded-2xl shadow-sm border border-slate-100 flex flex-col\">\n<div class=\"bg-brand-lightpink text-brand-pink px-3 py-1.5 rounded-xl font-bold text-xs flex items-center gap-2 mb-2\">\n<i class=\"fa-solid fa-list-ol\"></i> METHOD\n                        </div>\n<ol class=\"text-xs text-slate-700 space-y-1.5 pl-2 list-decimal list-inside leading-snug\" contenteditable=\"true\">\n<li>Marinate chicken with lemon juice, black pepper and a little salt.</li><li>Cook chicken in 1 tsp oil until completely cooked.</li><li>Mix yogurt with mint/coriander to make a light sauce.</li><li>Place chapati on a flat surface.</li><li>Add chicken, cucumber, tomato and lettuce.</li><li>Drizzle with yogurt sauce and roll tightly.</li><li>Cut into two halves and serve.</li>\n</ol>\n</div>\n</div>\n<div class=\"grid grid-cols-3 gap-3 z-10 relative\">\n<div class=\"bg-brand-lightpurple p-3 rounded-2xl border border-purple-100 text-xs\">\n<span class=\"font-bold text-brand-purple block mb-1\"><i class=\"fa-solid fa-weight-hanging mr-1\"></i> PORTION SIZE</span>\n<div class=\"text-slate-700\" contenteditable=\"true\">2  wraps </div>\n</div>\n<div class=\"bg-brand-lightblue p-3 rounded-2xl border border-blue-100 text-xs\">\n<span class=\"font-bold text-brand-blue block mb-1\"><i class=\"fa-solid fa-box-archive mr-1\"></i> MEAL PREP &amp; STORAGE</span>\n<div class=\"text-slate-700\" contenteditable=\"true\">Prepare the chicken in advance and refrigerate for up to 3 days. Assemble the wrap just before eating so the chapati doesn't become soggy.</div>\n</div>\n<div class=\"bg-brand-lightyellow p-3 rounded-2xl border border-amber-100 text-xs\">\n<span class=\"font-bold text-brand-yellow block mb-1\"><i class=\"fa-solid fa-lightbulb mr-1\"></i> NUTRITION TIP</span>\n<div class=\"text-slate-700 italic\" contenteditable=\"true\">\"Use grilled chicken and low-fat yogurt to keep protein high while controlling added fat.</div>\n</div>\n</div>\n\n"}, {"slideNumber": 6, "htmlContent": "\n<svg class=\"bg-leaf-1\" fill=\"none\" viewbox=\"0 0 200 200\"><path d=\"M100 0C150 50 180 120 180 200C100 200 20 150 0 100C30 30 70 0 100 0Z\" fill=\"#3d7042\"></path></svg>\n<div class=\"flex items-center space-x-3 z-10 relative\">\n<div class=\"w-12 h-12 rounded-2xl bg-gradient-to-br from-amber-400 to-orange-500 text-white flex items-center justify-center text-2xl shadow\">\n<i class=\"fa-solid fa-fish text-white\"></i>\n</div>\n<div>\n<h2 class=\"font-heading font-extrabold text-2xl text-brand-green tracking-tight\" contenteditable=\"true\">Recipe <span class=\"text-brand-pink\">CARD #3</span></h2>\n</div>\n</div>\n<div class=\"bg-white rounded-2xl shadow-sm border border-slate-100 grid grid-cols-2 text-xs z-10 relative recipe-info-box p-2.5 my-1.5 gap-2\">\n<div class=\"border-r border-slate-100 space-y-1\">\n<div class=\"flex items-center justify-between\">\n<span class=\"text-slate-500 font-medium\"><i class=\"fa-solid fa-book-open text-pink-500 mr-1.5\"></i> Recipe Name:</span>\n<span class=\"font-bold text-slate-800 border-b border-dashed border-slate-300\" contenteditable=\"true\">Grilled Fish with Boiled Rice</span>\n</div>\n<div class=\"flex items-center justify-between\">\n<span class=\"text-slate-500 font-medium\"><i class=\"fa-solid fa-users text-emerald-500 mr-1.5\"></i> Servings:</span>\n<span class=\"font-semibold text-slate-800 border-b border-dashed border-slate-300\" contenteditable=\"true\">1 Servings</span>\n</div>\n<div class=\"flex items-center justify-between\">\n<span class=\"text-slate-500 font-medium\"><i class=\"fa-regular fa-clock text-amber-500 mr-1.5\"></i> Prep Time:</span>\n<span class=\"font-semibold text-slate-800 border-b border-dashed border-slate-300\" contenteditable=\"true\">10 mins</span>\n</div>\n<div class=\"flex items-center justify-between\">\n<span class=\"text-slate-500 font-medium\"><i class=\"fa-solid fa-fire-burner text-purple-500 mr-1.5\"></i> Cooking Time:</span>\n<span class=\"font-semibold text-slate-800 border-b border-dashed border-slate-300\" contenteditable=\"true\">15-20 mins</span>\n</div>\n</div>\n<div class=\"space-y-1\">\n<div class=\"flex items-center justify-between\">\n<span class=\"text-slate-500 font-medium\"><i class=\"fa-solid fa-bolt text-amber-500 mr-1.5\"></i> Calories/Serving:</span>\n<span class=\"font-bold text-slate-800\"><span contenteditable=\"true\">350</span> kcal</span>\n</div>\n<div class=\"flex items-center justify-between\">\n<span class=\"text-slate-500 font-medium\"><i class=\"fa-solid fa-drumstick-bite text-pink-500 mr-1.5\"></i> Protein:</span>\n<span class=\"font-semibold text-slate-800\"><span contenteditable=\"true\">25</span> g</span>\n</div>\n<div class=\"flex items-center justify-between\">\n<span class=\"text-slate-500 font-medium\"><i class=\"fa-solid fa-wheat-awn text-emerald-500 mr-1.5\"></i> Carbohydrates:</span>\n<span class=\"font-semibold text-slate-800\"><span contenteditable=\"true\">40</span> g</span>\n</div>\n<div class=\"flex items-center justify-between\">\n<span class=\"text-slate-500 font-medium\"><i class=\"fa-solid fa-droplet text-amber-500 mr-1.5\"></i> Fat:</span>\n<span class=\"font-semibold text-slate-800\"><span contenteditable=\"true\">8</span> g</span>\n</div>\n</div>\n</div>\n<div class=\"grid grid-cols-12 gap-4 my-auto z-10 relative\">\n<div class=\"col-span-5 bg-white p-3.5 rounded-2xl shadow-sm border border-slate-100 flex flex-col\">\n<div class=\"bg-brand-lightgreen text-brand-green px-3 py-1.5 rounded-xl font-bold text-xs flex items-center gap-2 mb-2\">\n<i class=\"fa-solid fa-leaf\"></i> INGREDIENTS\n                        </div>\n<ul class=\"text-xs text-slate-700 space-y-1.5 pl-2 list-disc list-inside leading-snug\" contenteditable=\"true\">\n<li>100 g fish fillet (such as rohu or other lean fish)</li><li>160-200g cooked boiled rice</li><li>1 tsp oil</li><li>1 tsp lemon juice</li><li>¼ tsp garlic powder</li><li>¼ tsp black pepper</li><li>¼ tsp dried oregano</li><li>Pinch of salt</li><li>Fresh coriander, for garnish</li>\n</ul>\n</div>\n<div class=\"col-span-7 bg-white p-3.5 rounded-2xl shadow-sm border border-slate-100 flex flex-col\">\n<div class=\"bg-brand-lightpink text-brand-pink px-3 py-1.5 rounded-xl font-bold text-xs flex items-center gap-2 mb-2\">\n<i class=\"fa-solid fa-list-ol\"></i> METHOD\n                        </div>\n<ol class=\"text-xs text-slate-700 space-y-1.5 pl-2 list-decimal list-inside leading-snug\" contenteditable=\"true\">\n<li>Clean the fish and pat it dry.</li><li>Marinate with lemon juice, garlic powder, black pepper, oregano and a small amount of salt.</li><li>Leave for 5–10 minutes.</li><li>Heat a non-stick grill pan and add 1 tsp oil.</li><li>Grill the fish for about 4–6 minutes on each side, or until completely cooked and flaky.</li><li>Serve with 160-200g boiled rice.</li><li>Garnish with fresh coriander and a little lemon juice.</li>\n</ol>\n</div>\n</div>\n<div class=\"grid grid-cols-3 gap-3 z-10 relative\">\n<div class=\"bg-brand-lightpurple p-3 rounded-2xl border border-purple-100 text-xs\">\n<span class=\"font-bold text-brand-purple block mb-1\"><i class=\"fa-solid fa-weight-hanging mr-1\"></i> PORTION SIZE</span>\n<div class=\"text-slate-700\" contenteditable=\"true\">1 serving = 1 fillet + 160-200g cooked rice </div>\n</div>\n<div class=\"bg-brand-lightblue p-3 rounded-2xl border border-blue-100 text-xs\">\n<span class=\"font-bold text-brand-blue block mb-1\"><i class=\"fa-solid fa-box-archive mr-1\"></i> MEAL PREP &amp; STORAGE</span>\n<div class=\"text-slate-700\" contenteditable=\"true\">Cooked fish and rice can be refrigerated separately and used within 1–2 days. Reheat thoroughly before serving.</div>\n</div>\n<div class=\"bg-brand-lightyellow p-3 rounded-2xl border border-amber-100 text-xs\">\n<span class=\"font-bold text-brand-yellow block mb-1\"><i class=\"fa-solid fa-lightbulb mr-1\"></i> NUTRITION TIP</span>\n<div class=\"text-slate-700 italic\" contenteditable=\"true\">\"Choose a lean fish and keep the oil measured. Boiled rice provides carbohydrate while fish provides high-quality protein.</div>\n</div>\n</div>\n\n"}, {"slideNumber": 7, "htmlContent": "\n<svg class=\"bg-leaf-1\" fill=\"none\" viewbox=\"0 0 200 200\"><path d=\"M100 0C150 50 180 120 180 200C100 200 20 150 0 100C30 30 70 0 100 0Z\" fill=\"#3d7042\"></path></svg>\n<div class=\"flex items-center space-x-3 z-10 relative\">\n<div class=\"w-12 h-12 rounded-2xl bg-gradient-to-br from-purple-400 to-indigo-600 text-white flex items-center justify-center text-2xl shadow\">\n<i class=\"fa-solid fa-spoon\"></i>\n</div>\n<div>\n<h2 class=\"font-heading font-extrabold text-2xl text-brand-green tracking-tight\" contenteditable=\"true\">Recipe <span class=\"text-brand-pink\">CARD #4</span></h2>\n</div>\n</div>\n<div class=\"bg-white rounded-2xl shadow-sm border border-slate-100 grid grid-cols-2 text-xs z-10 relative recipe-info-box p-2.5 my-1.5 gap-2\">\n<div class=\"border-r border-slate-100 space-y-1\">\n<div class=\"flex items-center justify-between\">\n<span class=\"text-slate-500 font-medium\"><i class=\"fa-solid fa-book-open text-pink-500 mr-1.5\"></i> Recipe Name:</span>\n<span class=\"font-bold text-slate-800 border-b border-dashed border-slate-300\" contenteditable=\"true\">Greek Yogurt &amp; Berry Layered Parfait</span>\n</div>\n<div class=\"flex items-center justify-between\">\n<span class=\"text-slate-500 font-medium\"><i class=\"fa-solid fa-users text-emerald-500 mr-1.5\"></i> Servings:</span>\n<span class=\"font-semibold text-slate-800 border-b border-dashed border-slate-300\" contenteditable=\"true\">1 Serving</span>\n</div>\n<div class=\"flex items-center justify-between\">\n<span class=\"text-slate-500 font-medium\"><i class=\"fa-regular fa-clock text-amber-500 mr-1.5\"></i> Prep Time:</span>\n<span class=\"font-semibold text-slate-800 border-b border-dashed border-slate-300\" contenteditable=\"true\">5 mins</span>\n</div>\n<div class=\"flex items-center justify-between\">\n<span class=\"text-slate-500 font-medium\"><i class=\"fa-solid fa-fire-burner text-purple-500 mr-1.5\"></i> Cooking Time:</span>\n<span class=\"font-semibold text-slate-800 border-b border-dashed border-slate-300\" contenteditable=\"true\">0 mins (No-Cook)</span>\n</div>\n</div>\n<div class=\"space-y-1\">\n<div class=\"flex items-center justify-between\">\n<span class=\"text-slate-500 font-medium\"><i class=\"fa-solid fa-bolt text-amber-500 mr-1.5\"></i> Calories/Serving:</span>\n<span class=\"font-bold text-slate-800\"><span contenteditable=\"true\">240</span> kcal</span>\n</div>\n<div class=\"flex items-center justify-between\">\n<span class=\"text-slate-500 font-medium\"><i class=\"fa-solid fa-drumstick-bite text-pink-500 mr-1.5\"></i> Protein:</span>\n<span class=\"font-semibold text-slate-800\"><span contenteditable=\"true\">22</span> g</span>\n</div>\n<div class=\"flex items-center justify-between\">\n<span class=\"text-slate-500 font-medium\"><i class=\"fa-solid fa-wheat-awn text-emerald-500 mr-1.5\"></i> Carbohydrates:</span>\n<span class=\"font-semibold text-slate-800\"><span contenteditable=\"true\">26</span> g</span>\n</div>\n<div class=\"flex items-center justify-between\">\n<span class=\"text-slate-500 font-medium\"><i class=\"fa-solid fa-droplet text-amber-500 mr-1.5\"></i> Fat:</span>\n<span class=\"font-semibold text-slate-800\"><span contenteditable=\"true\">4</span> g</span>\n</div>\n</div>\n</div>\n<div class=\"grid grid-cols-12 gap-4 my-auto z-10 relative\">\n<div class=\"col-span-5 bg-white p-3.5 rounded-2xl shadow-sm border border-slate-100 flex flex-col\">\n<div class=\"bg-brand-lightgreen text-brand-green px-3 py-1.5 rounded-xl font-bold text-xs flex items-center gap-2 mb-2\">\n<i class=\"fa-solid fa-leaf\"></i> INGREDIENTS\n                        </div>\n<ul class=\"text-xs text-slate-700 space-y-1.5 pl-2 list-disc list-inside leading-snug\" contenteditable=\"true\">\n<li>1 cup Plain non-fat Greek yogurt</li>\n<li>1/2 cup Mixed berries (strawberries/blueberries)</li>\n<li>2 tbsp Whole oats or low-sugar granola</li>\n<li>1 tsp Honey or pure maple syrup</li>\n<li>1 tsp Flaxseeds or chia seeds</li>\n</ul>\n</div>\n<div class=\"col-span-7 bg-white p-3.5 rounded-2xl shadow-sm border border-slate-100 flex flex-col\">\n<div class=\"bg-brand-lightpink text-brand-pink px-3 py-1.5 rounded-xl font-bold text-xs flex items-center gap-2 mb-2\">\n<i class=\"fa-solid fa-list-ol\"></i> METHOD\n                        </div>\n<ol class=\"text-xs text-slate-700 space-y-1.5 pl-2 list-decimal list-inside leading-snug\" contenteditable=\"true\">\n<li>Spoon half of the Greek yogurt into a glass jar or dessert cup.</li>\n<li>Add a layer of mixed berries and 1 tbsp of oats/granola.</li>\n<li>Add remaining Greek yogurt on top.</li>\n<li>Finish with remaining berries, seeds, and a light drizzle of honey.</li>\n<li>Serve chilled immediately or store in fridge for breakfast.</li>\n</ol>\n</div>\n</div>\n<div class=\"grid grid-cols-3 gap-3 z-10 relative\">\n<div class=\"bg-brand-lightpurple p-3 rounded-2xl border border-purple-100 text-xs\">\n<span class=\"font-bold text-brand-purple block mb-1\"><i class=\"fa-solid fa-weight-hanging mr-1\"></i> PORTION SIZE</span>\n<div class=\"text-slate-700\" contenteditable=\"true\">1 serving = 1 jar (~250g)</div>\n</div>\n<div class=\"bg-brand-lightblue p-3 rounded-2xl border border-blue-100 text-xs\">\n<span class=\"font-bold text-brand-blue block mb-1\"><i class=\"fa-solid fa-box-archive mr-1\"></i> MEAL PREP &amp; STORAGE</span>\n<div class=\"text-slate-700\" contenteditable=\"true\">Can be prepped in mason jars for up to 2 days. Keep granola separate until eating.</div>\n</div>\n<div class=\"bg-brand-lightyellow p-3 rounded-2xl border border-amber-100 text-xs\">\n<span class=\"font-bold text-brand-yellow block mb-1\"><i class=\"fa-solid fa-lightbulb mr-1\"></i> NUTRITION TIP</span>\n<div class=\"text-slate-700 italic\" contenteditable=\"true\">\"Greek yogurt packs twice the protein of regular yogurt plus live gut probiotics!\"</div>\n</div>\n</div>\n\n"}, {"slideNumber": 8, "htmlContent": "\n<svg class=\"bg-leaf-1\" fill=\"none\" viewbox=\"0 0 200 200\"><path d=\"M100 0C150 50 180 120 180 200C100 200 20 150 0 100C30 30 70 0 100 0Z\" fill=\"#3d7042\"></path></svg>\n<div class=\"flex items-center space-x-3 z-10 relative\">\n<div class=\"w-12 h-12 rounded-2xl bg-gradient-to-br from-yellow-500 to-amber-600 text-white flex items-center justify-center text-2xl shadow\">\n<i class=\"fa-solid fa-mug-hot\"></i>\n</div>\n<div>\n<h2 class=\"font-heading font-extrabold text-2xl text-brand-green tracking-tight\" contenteditable=\"true\">Recipe <span class=\"text-brand-pink\">CARD #5</span></h2>\n</div>\n</div>\n<div class=\"bg-white rounded-2xl shadow-sm border border-slate-100 grid grid-cols-2 text-xs z-10 relative recipe-info-box p-2.5 my-1.5 gap-2\">\n<div class=\"border-r border-slate-100 space-y-1\">\n<div class=\"flex items-center justify-between\">\n<span class=\"text-slate-500 font-medium\"><i class=\"fa-solid fa-book-open text-pink-500 mr-1.5\"></i> Recipe Name:</span>\n<span class=\"font-bold text-slate-800 border-b border-dashed border-slate-300\" contenteditable=\"true\">Creamy Chicken Vegetable Pasta</span>\n</div>\n<div class=\"flex items-center justify-between\">\n<span class=\"text-slate-500 font-medium\"><i class=\"fa-solid fa-users text-emerald-500 mr-1.5\"></i> Servings:</span>\n<span class=\"font-semibold text-slate-800 border-b border-dashed border-slate-300\" contenteditable=\"true\">1 Servings</span>\n</div>\n<div class=\"flex items-center justify-between\">\n<span class=\"text-slate-500 font-medium\"><i class=\"fa-regular fa-clock text-amber-500 mr-1.5\"></i> Prep Time:</span>\n<span class=\"font-semibold text-slate-800 border-b border-dashed border-slate-300\" contenteditable=\"true\">10 mins</span>\n</div>\n<div class=\"flex items-center justify-between\">\n<span class=\"text-slate-500 font-medium\"><i class=\"fa-solid fa-fire-burner text-purple-500 mr-1.5\"></i> Cooking Time:</span>\n<span class=\"font-semibold text-slate-800 border-b border-dashed border-slate-300\" contenteditable=\"true\">12-15 mins</span>\n</div>\n</div>\n<div class=\"space-y-1\">\n<div class=\"flex items-center justify-between\">\n<span class=\"text-slate-500 font-medium\"><i class=\"fa-solid fa-bolt text-amber-500 mr-1.5\"></i> Calories/Serving:</span>\n<span class=\"font-bold text-slate-800\"><span contenteditable=\"true\">335</span> kcal</span>\n</div>\n<div class=\"flex items-center justify-between\">\n<span class=\"text-slate-500 font-medium\"><i class=\"fa-solid fa-drumstick-bite text-pink-500 mr-1.5\"></i> Protein:</span>\n<span class=\"font-semibold text-slate-800\"><span contenteditable=\"true\">25</span> g</span>\n</div>\n<div class=\"flex items-center justify-between\">\n<span class=\"text-slate-500 font-medium\"><i class=\"fa-solid fa-wheat-awn text-emerald-500 mr-1.5\"></i> Carbohydrates:</span>\n<span class=\"font-semibold text-slate-800\"><span contenteditable=\"true\">38</span> g</span>\n</div>\n<div class=\"flex items-center justify-between\">\n<span class=\"text-slate-500 font-medium\"><i class=\"fa-solid fa-droplet text-amber-500 mr-1.5\"></i> Fat:</span>\n<span class=\"font-semibold text-slate-800\"><span contenteditable=\"true\">10</span> g</span>\n</div>\n</div>\n</div>\n<div class=\"grid grid-cols-12 gap-4 my-auto z-10 relative\">\n<div class=\"col-span-5 bg-white p-3.5 rounded-2xl shadow-sm border border-slate-100 flex flex-col\">\n<div class=\"bg-brand-lightgreen text-brand-green px-3 py-1.5 rounded-xl font-bold text-xs flex items-center gap-2 mb-2\">\n<i class=\"fa-solid fa-leaf\"></i> INGREDIENTS\n                        </div>\n<ul class=\"text-xs text-slate-700 space-y-1.5 pl-2 list-disc list-inside leading-snug\" contenteditable=\"true\">\n<li><span style=\"font-size: 0.75rem;\">⅔ cup cooked pasta</span></li><li>60 g cooked chicken breast, shredded</li><li>½ cup mixed vegetables — capsicum, carrot and tomato</li><li>1 tbsp low-fat cooking cream</li><li>1 tsp oil</li><li>½ tsp garlic, minced</li><li>¼ tsp black pepper</li><li>Pinch of salt</li><li>1 tsp lemon juice</li><li>1 tbsp coriander/parsley</li>\n</ul>\n</div>\n<div class=\"col-span-7 bg-white p-3.5 rounded-2xl shadow-sm border border-slate-100 flex flex-col\">\n<div class=\"bg-brand-lightpink text-brand-pink px-3 py-1.5 rounded-xl font-bold text-xs flex items-center gap-2 mb-2\">\n<i class=\"fa-solid fa-list-ol\"></i> METHOD\n                        </div>\n<ol class=\"text-xs text-slate-700 space-y-1.5 pl-2 list-decimal list-inside leading-snug\" contenteditable=\"true\">\n<li>Boil pasta until tender and drain.</li><li>Heat 1 tsp oil in a non-stick pan.</li><li>Add garlic and mixed vegetables; sauté for 2–3 minutes.</li><li>Add shredded chicken and cook fo function ensureStructure(slide){
  // Remove generated headers/footers first so re-loading JSON never duplicates them.
  slide.querySelectorAll('.standard-header,.standard-footer').forEach(e=>e.remove());

  const n = Number(slide.dataset.pageNumber) || (Array.from(document.querySelectorAll('#slidesWrapper > .slide-canvas')).indexOf(slide) + 1);

  // Recipe/detail slides 4-8: remove EVERY original footer block, including
  // footers that came directly from the JSON and do not have .standard-footer.
  if([4,5,6,7,8].includes(n)){
    [...slide.children].forEach(el=>{
      const hasBrandFooter = el.querySelector && el.querySelector('.brand-tagline');
      const looksLikeFooter = /NOURISHING BODIES|NOURISHING BODIES, ENRICHING LIVES/i.test(el.textContent || '') &&
                              (el.className || '').toString().includes('border-t');
      if(hasBrandFooter || looksLikeFooter) el.remove();
    });
  } else {
    // Remove any old generated footer before adding exactly one.
    [...slide.children].forEach(el=>{
      if(el.querySelector && el.querySelector('.brand-tagline') && (el.className||'').toString().includes('border-t')) el.remove();
    });
    slide.insertAdjacentHTML('beforeend', footerHTML());
  }

  // Header is only added when the JSON page doesn't already contain one.
  if(!slide.querySelector('.brand-name') || !slide.querySelector('.brand-title')){
    slide.insertAdjacentHTML('afterbegin', headerHTML());
  }

  // Recipe information box: compact, but allow long values to wrap cleanly.
  const recipeLabel = [...slide.querySelectorAll('*')].find(el =>
    el.childElementCount === 0 && /Recipe Name:/i.test(el.textContent || '')
  );
  if(recipeLabel){
    const box = recipeLabel.closest('.grid.grid-cols-2');
    if(box){
      box.classList.add('recipe-info-box');
      ['p-3.5','p-4','my-2','my-1','gap-4'].forEach(c=>box.classList.remove(c));
      ['p-2','my-1','gap-2'].forEach(c=>box.classList.add(c));
      box.querySelectorAll('[class*="space-y-1.5"],[class*="space-y-2"]').forEach(x=>{
        x.classList.remove('space-y-1.5','space-y-2');
        x.classList.add('space-y-1');
      });
      box.querySelectorAll('.pr-4,.pl-2').forEach(x=>x.classList.remove('pr-4','pl-2'));
      box.querySelectorAll('i').forEach(x=>x.classList.remove('mr-1.5'));
      box.querySelectorAll('.flex.items-center.justify-between').forEach(row=>row.classList.add('gap-2'));
      box.querySelectorAll('span').forEach(x=>x.style.lineHeight='1.15');
    }

    // Ingredients: use two compact columns when there are enough items.
    const ingredientHeading = [...slide.querySelectorAll('*')].find(el =>
      el.childElementCount === 0 && /INGREDIENTS/i.test(el.textContent || '')
    );
    if(ingredientHeading){
      const ingredientsPanel = ingredientHeading.closest('.flex.flex-col');
      const list = ingredientsPanel && ingredientsPanel.querySelector('ul');
      if(list){
        list.style.display='grid';
        list.style.gridTemplateColumns='repeat(2,minmax(0,1fr))';
        list.style.alignItems='start';
        list.querySelectorAll('li').forEach(li=>{ li.style.margin='0'; li.style.padding='0'; li.style.breakInside='avoid'; });
        list.style.columnGap='18px';
        list.style.rowGap='4px';
        list.style.paddingLeft='6px';
        list.style.lineHeight='1.2';
      }
    }
  }
}

function renderProject(raw,notify=true){
 try{
  const slides=normalizeSlides(raw);

 // Duplicate immediately AFTER the current page, not at the end.

function escapeHtml(x){return String(x).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
async function renderSlideHighQuality(slideElement) {
    const wasHidden = slideElement.classList.contains('hidden');
    const previousActive = activeSlideIndex;

    // Allow the page to grow when its content needs more room. Never crop the bottom.
    slideElement.classList.remove('hidden');
    slideElement.style.width = '1000px';
    slideElement.style.height = 'auto';
    slideElement.style.minHeight = '625px';
    slideElement.style.margin = '0';
    slideElement.style.transform = 'none';
    slideElement.style.overflow = 'visible';

    // Give the browser time to finish fonts/layout before measuring/capturing.
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
    const captureWidth = 1000;
    const captureHeight = Math.max(625, Math.ceil(slideElement.scrollHeight), Math.ceil(slideElement.getBoundingClientRect().height));
    slideElement.style.height = captureHeight + 'px';

    const canvas = await html2canvas(slideElement, {
        scale: 4,
        width: captureWidth,
        height: captureHeight,
        windowWidth: captureWidth,
        windowHeight: captureHeight,
        useCORS: true,
        allowTaint: false,
        backgroundColor: '#ffffff',
        logging: false,
        imageTimeout: 0,
        removeContainer: true,
        onclone: (clonedDoc) => {
            const clonedSlide = clonedDoc.getElementById(slideElement.id);
            if (clonedSlide) {
                clonedSlide.classList.remove('hidden');
                clonedSlide.style.width = '1000px';
                clonedSlide.style.height = captureHeight + 'px';
                clonedSlide.style.minHeight = '625px';
                clonedSlide.style.overflow = 'visible';
                clonedSlide.style.margin = '0';
                clonedSlide.style.transform = 'none';
                clonedSlide.style.boxShadow = 'none';
                clonedSlide.style.borderRadius = '0';
            }
        }
    });

    slideElement.style.height = '';
    slideElement.style.minHeight = '';
    slideElement.style.overflow = '';
    if (wasHidden) slideElement.classList.add('hidden');
    return canvas;
}

async function generateCustomPdf(){
    const selected = [...document.querySelectorAll('.pdf-page-checkbox:checked')]
        .map(x => +x.value);

    if (!selected.length) {
        alert('Please select at least one slide.');
        return;
    }

    const overlay = document.getElementById('pdfProgressOverlay');
    const status = document.getElementById('pdfStatusText');
    overlay.classList.remove('hidden');

    try {
        const { jsPDF } = window.jspdf;

        // IMPORTANT: the editor canvas is 1000x625 = 8:5.
        // Keep exactly the same ratio in the PDF so nothing gets stretched/cropped.
        const PDF_W = 256;
        const PDF_H = 160;
        const pdf = new jsPDF({
            orientation: 'landscape',
            unit: 'mm',
            format: [PDF_W, PDF_H],
            compress: true,
            putOnlyUsedFonts: true
        });

        const slides = [...document.querySelectorAll('#slidesWrapper > .slide-canvas')];
        const oldActive = activeSlideIndex;

        for (let i = 0; i < selected.length; i++) {
            const slide = slides[selected[i] - 1];
            if (!slide) continue;

            status.innerText = `Rendering slide ${i + 1} of ${selected.length} in high quality...`;
            const canvas = await renderSlideHighQuality(slide);

            // PNG keeps small text, icons and lines much sharper than JPEG.
            const imgData = canvas.toDataURL('image/png');

            if (i > 0) pdf.addPage([PDF_W, PDF_H], 'landscape');
            pdf.addImage(imgData, 'PNG', 0, 0, PDF_W, PDF_H, undefined, 'FAST');
        }

        switchSlide(oldActive);
        status.innerText = 'Creating high-quality PDF...';
        await new Promise(r => setTimeout(r, 150));
        pdf.save('Dietitian_Nutrition_Plan_HQ.pdf');
    } catch (error) {
        console.error(error);
        alert('PDF export failed. Please try again.');
    } finally {
        overlay.classList.add('hidden');
        closePdfModal();
    }
}

async function openPptModal() {
    const slides = [...document.querySelectorAll('#slidesWrapper > .slide-canvas')];
    if (!slides.length) { alert('Please load or create slides first.'); return; }

    let modal = document.getElementById('pptModal');
    if (!modal) {
        modal = document.createElement('div');
        modal.id = 'pptModal';
        modal.className = 'fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center';
        modal.innerHTML = `
          <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl p-6 relative">
            <div class="flex items-center justify-between pb-3 border-b border-slate-100 mb-4">
              <h3 class="text-base font-bold text-slate-800"><i class="fa-solid fa-file-powerpoint text-orange-600"></i> Select Pages for PPT</h3>
              <button onclick="closePptModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="flex items-center justify-between mb-3 text-xs">
              <span class="text-slate-500 font-medium">Choose pages to include:</span>
              <div class="space-x-2">
                <button onclick="selectAllPptPages(true)" class="text-orange-600 hover:underline font-semibold">Select All</button>
                <span class="text-slate-300">|</span>
                <button onclick="selectAllPptPages(false)" class="text-slate-500 hover:underline">Clear</button>
              </div>
            </div>
            <div id="pptPageList" class="space-y-2 max-h-60 overflow-y-auto pr-2 mb-5"></div>
            <div class="flex justify-end space-x-3 pt-3 border-t border-slate-100">
              <button onclick="closePptModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-lg text-xs font-semibold">Cancel</button>
              <button onclick="generateSelectedPpt()" id="pptExportSubmitBtn" class="px-5 py-2 bg-orange-600 hover:bg-orange-500 text-white rounded-lg text-xs font-semibold flex items-center gap-2 shadow"><i class="fa-solid fa-file-powerpoint"></i> Export PPT</button>
            </div>
          </div>`;
        document.body.appendChild(modal);
    }
    const list = document.getElementById('pptPageList');
    list.innerHTML = '';
    slides.forEach((slide, idx) => {
        const title = slide.getAttribute('data-title') || `Slide ${idx + 1}`;
        const label = document.createElement('label');
        label.className = 'flex items-center justify-between p-2.5 rounded-lg border border-slate-200 hover:bg-slate-50 cursor-pointer text-xs';
        label.innerHTML = `<div class="flex items-center space-x-2.5"><input type="checkbox" value="${idx + 1}" checked class="ppt-page-checkbox rounded text-orange-600 focus:ring-orange-500 w-4 h-4"><span class="font-bold text-slate-700">Slide ${idx + 1}:</span><span class="text-slate-600">${title}</span></div><i class="fa-solid fa-file-powerpoint text-slate-300"></i>`;
        list.appendChild(label);
    });
    modal.classList.remove('hidden');
}

function closePptModal() {
    const modal = document.getElementById('pptModal');
    if (modal) modal.classList.add('hidden');
}

function selectAllPptPages(select) {
    document.querySelectorAll('.ppt-page-checkbox').forEach(cb => cb.checked = select);
}

async function generateSelectedPpt() {
    const selected = [...document.querySelectorAll('.ppt-page-checkbox:checked')].map(cb => parseInt(cb.value, 10));
    if (!selected.length) { alert('Please select at least one slide page to export.'); return; }

    const slides = [...document.querySelectorAll('#slidesWrapper > .slide-canvas')];
    const button = document.getElementById('pptExportSubmitBtn');
    if (button) { button.disabled = true; button.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Rendering...'; }
    const oldActive = activeSlideIndex;

    try {
        const pptx = new PptxGenJS();
        pptx.defineLayout({ name: 'NUTRITION_8_5', width: 12.8, height: 8.0 });
        pptx.layout = 'NUTRITION_8_5';
        pptx.author = 'Dietitian Slide Suite';
        pptx.subject = 'Nutrition Plan';
        pptx.title = 'Dietitian Nutrition Plan';
        pptx.company = 'Dietitian Slide Suite';
        pptx.lang = 'en-US';
        pptx.theme = { headFontFace: 'Montserrat', bodyFontFace: 'Poppins', lang: 'en-US' };

        for (let i = 0; i < selected.length; i++) {
            const pageNo = selected[i];
            const slideEl = slides[pageNo - 1];
            if (!slideEl) continue;
            if (button) button.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Slide ${i + 1}/${selected.length}`;
            const canvas = await renderSlideHighQuality(slideEl);
            const data = canvas.toDataURL('image/png');
            const pptSlide = pptx.addSlide();
            pptSlide.background = { color: 'FFFFFF' };
            const ratio = canvas.height / canvas.width;
            const maxW = 12.8, maxH = 8.0;
            let w = maxW, h = w * ratio;
            if (h > maxH) { h = maxH; w = h / ratio; }
            pptSlide.addImage({ data, x: (maxW - w) / 2, y: (maxH - h) / 2, w, h });
        }
        switchSlide(oldActive);
        if (button) button.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Saving...';
        await pptx.writeFile({ fileName: 'Dietitian_Nutrition_Plan_Selected.pptx' });
        closePptModal();
    } catch (error) {
        console.error(error);
        alert('PowerPoint export failed. Please try again.');
    } finally {
        if (button) { button.disabled = false; button.innerHTML = '<i class="fa-solid fa-file-powerpoint"></i> Export PPT'; }
    }
}

function exportPPTX() { openPptModal(); }
